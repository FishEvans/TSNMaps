    <style>
        html, body { margin: 0; height: 100%; background: black; color: white; }

            overflow-y: auto;
            padding: 10px 12px;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }
        #controls { flex: 1; min-width: 220px; max-width: 350px; }
        #plot {
            flex: 3;
            min-width: 0;
            position: relative;
            touch-action: none;
            background:

                radial-gradient(circle at bottom, rgba(255, 196, 0, 0.08), transparent 34%),
                #050608;

        #info {
            flex: 1;
            min-width: 240px;
            border-right: none;
            border-left: 1px solid var(--panel-border);
        }
        #mobile-toolbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            height: var(--mobile-toolbar-height);
            padding: env(safe-area-inset-top, 0) 12px 10px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--toolbar-border);
            box-sizing: border-box;
            align-items: center;
            gap: 10px;
        }
        #mobile-title {
            flex: 1;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;

            font-weight: 700;
            text-transform: uppercase;

            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        #author-tooltip {
            position: absolute;

            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.65);

            color: #00e5ff;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;

            width: 100%;
            margin-bottom: 5px;
            background: rgba(54, 54, 54, 0.94);
            color: white;

            font-size: 20px;

            filter: none;
        }
        #search-box {

            body { display: block; }

                transition: transform 0.24s ease;

            #controls {

            #info {
                right: 0;
                border-left: 1px solid var(--panel-border);
                transform: translateX(104%);
            }
            body.drawer-left-open #controls { transform: translateX(0); }
            body.drawer-right-open #info { transform: translateX(0); }
            body.drawer-left-open #panel-overlay,
            body.drawer-right-open #panel-overlay { display: block; }
            #plot {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
            }
            .info-title { font-size: 22px; }
            .info-desc, .desc-text, .hull-desc { font-size: 15px; }
            button { font-size: 17px; }
            button.header { font-size: 20px; }
        }

    function isMobileLayout() {
        return window.matchMedia('(max-width: 900px)').matches;
    }

    function closePanels() {
        pageBody.classList.remove('drawer-left-open', 'drawer-right-open');
        syncMobileToggles();
    }

    function openControlsPanel() {
        if (!isMobileLayout()) return;
        pageBody.classList.add('drawer-left-open');
        pageBody.classList.remove('drawer-right-open');
        syncMobileToggles();
    }

    function openInfoPanel() {
        if (!isMobileLayout()) return;
        pageBody.classList.add('drawer-right-open');
        pageBody.classList.remove('drawer-left-open');
        syncMobileToggles();
    }

    function toggleControlsPanel() {
        if (!isMobileLayout()) return;
        var willOpen = !pageBody.classList.contains('drawer-left-open');
        closePanels();
        if (willOpen) {
            pageBody.classList.add('drawer-left-open');
        }
        syncMobileToggles();
    }

    function toggleInfoPanel() {
        if (!isMobileLayout()) return;
        var willOpen = !pageBody.classList.contains('drawer-right-open');
        closePanels();
        if (willOpen) {
            pageBody.classList.add('drawer-right-open');
        }
        syncMobileToggles();
    }

    function syncMobileToggles() {
        var controlsBtn = document.getElementById('mobile-controls-btn');
        var infoBtn = document.getElementById('mobile-info-btn');
        if (!controlsBtn || !infoBtn) return;
        controlsBtn.setAttribute('aria-expanded', pageBody.classList.contains('drawer-left-open') ? 'true' : 'false');
        infoBtn.setAttribute('aria-expanded', pageBody.classList.contains('drawer-right-open') ? 'true' : 'false');
    }

    function safeText(value, fallback) {
        if (value === undefined || value === null || value === '') return fallback;
        return value;
    }

    function listOrNone(list) {
        return (list && list.length) ? list.join(', ') : 'None';
    }

    function getDefaultInfo() {
        var html = '';
        html += '<div class="info-title">' + safeText(systemMeta.system_name, 'Unknown System') + '</div>';
        var origAuthor = safeText(systemMeta.original_author, 'Unknown');
        var lastAuthor = safeText(systemMeta.last_author, '');
        var authorLine = origAuthor;
        if (lastAuthor && lastAuthor !== origAuthor) {
            authorLine = origAuthor + ' & ' + lastAuthor;
        }
        var allAuthors = (systemMeta.all_authors && systemMeta.all_authors.length)
            ? systemMeta.all_authors.join(', ')
            : authorLine;
        var focus = safeText(systemMeta.focus, 'None');
        var exportsText = listOrNone(systemMeta.exports);
        var pirate = (systemMeta.intel && systemMeta.intel.pirate) ? systemMeta.intel.pirate : 'Unknown';
        var enemy = (systemMeta.intel && systemMeta.intel.enemy) ? systemMeta.intel.enemy : 'Unknown';
        var assets = (systemMeta.assets && systemMeta.assets.length) ? systemMeta.assets : [];
        html += '<div class="info-meta-block author-hover" data-authors="' + allAuthors + '">';
        html += '<div class="info-meta">Cartographers: ' + authorLine + '</div>';
        html += '<div class="info-meta">Version: ' + safeText(systemMeta.version_tag, 'unknown') + '</div>';
        html += '</div>';
        html += '<div class="info-desc">' + (systemMeta.description || 'No description available.') + '</div>';
        html += '<div class="info-section"><strong>System Focus:</strong> ' + focus + '</div>';
        html += '<div class="info-section"><strong>Intel:</strong></div>';
        html += '<div>' +
            '<img src="Images/SysBadges/' + pirate + 'Pirate.png" width="50" height="50" alt="' + pirate + ' Pirate" /> ' +
            '<img src="Images/SysBadges/' + enemy + 'Enemy.png" width="50" height="50" alt="' + enemy + ' Enemy" />' +
            '</div>';
        html += '<div>Pirate Activity: ' + pirate + '</div>';
        html += '<div>Enemy Activity: ' + enemy + '</div>';
        html += '<div class="info-section"><strong>Important Assets:</strong></div>';
        html += '<div class="asset-icons">' +
            assets.map(function(a) {
                return '<img src="Images/SysBadges/' + a + '.png" width="50" height="50" alt="' + a + '" title="' + a + '" />';
            }).join('') +
            '</div>';
        html += '<div class="asset-text">' +
            assets.map(function(a) { return '<div>' + a + '</div>'; }).join('') +
            '</div>';
        html += '<div class="info-section"><strong>Exports:</strong> ' + exportsText + '</div>';
        return html;
    }

    function bindGalacticButton() {
        var btn = document.getElementById('galactic-map-btn');
        if (btn) {
            btn.onclick = function() {
                window.location.href = 'index.html';
            };
        }
    }

    function setDefaultInfo() {
        document.getElementById('info').innerHTML = getInfoHeader() + getDefaultInfo();
        bindGalacticButton();
        attachAuthorHover();
    }

    function clearAnnotations() {
        Plotly.relayout('plot', {annotations: []});
        setDefaultInfo();

    function getInfoHeader() {
    return '<img src="Images/Compass.png" alt="Compass" '

         + '<button id="galactic-map-btn" title="Back to Galactic Map">Galactic Map</button>';

    function highlight(name) {
        var obj = objData[name];
        if (!obj) return false;
        if (obj.hidden && !isGM()) {
            alert("This object is not visible on the public map.");
            return false;
        }
        var annotation = {
            x: obj.x, y: obj.y, xref: 'x', yref: 'y', text: name,
            showarrow: true, arrowcolor: 'yellow', arrowwidth: 2,
            arrowhead: 3, font: {color: 'yellow', size: 28}
        };

        Plotly.relayout('plot', {annotations: [annotation]});

        var label = obj.label || name;
        var infoHtml = '<span style="font-size:20pt;">' + label + '</span><br>';
        infoHtml += '<b>Location:</b> ' + obj.grid + '<br>';

        if (obj.type === 'station') {
            // Station selected: display detailed station info
            if (obj.hullImage) {
                infoHtml += '<img src="' + obj.hullImage + '" alt="Hull Art" style="max-width:48%; height:auto;">';
            }
            if (obj.sides && obj.sides.length > 0) {
                infoHtml += '<img src="Images/Factions/' + obj.sides[0] + '.png" alt="Faction Logo" style="max-width:48%; height:auto;">';
            }
            infoHtml += '<b>Facilities:</b> ' + (obj.facilities.length ? obj.facilities.join(', ') : 'None') + '<br>';
            if (obj.hullName && obj.hullImage) {
                infoHtml += '<b>General Class:</b> ' + obj.hullName + '<br>';
            }
            if (obj.hullDescription) {
                infoHtml += '<p class="hull-desc">' + obj.hullDescription + '</p>';
            }
        } 
        else if ((obj.type === 'jump_point' || obj.type === 'jumppoint' || obj.type === 'jumpnode') && obj.destinations && typeof obj.destinations === 'object') {
        
            // Generate a random 5-character alphanumeric serial
            const serial = Math.random().toString(36).substring(2, 7).toUpperCase();
            infoHtml += 'Oliver Class jump stabilisation node. Serial: ' + serial;
            infoHtml += '<br><br><b>Destinations:</b><br>';
            for (const [target, label] of Object.entries(obj.destinations)) {
                if (typeof target === 'string' && typeof label === 'string') {
                    let file = label + '.html';
                    // Correctly escape single quotes for JS string
                    infoHtml += `<button onclick="window.open('${file}', '_blank')">${label}, ${target}</button>`;
                }
            }
            }
        else if (obj.type === 'sensor_relay') {
            // Generate a random 5-character alphanumeric serial
            const serial = Math.random().toString(36).substring(2, 7).toUpperCase();
            const relayType = obj.relayType || 'Sensor Relay';
            infoHtml += '<b>Subtype:</b> ' + relayType + '<br>';
            if (relayType === 'Warning Buoy') {
                infoHtml += 'Warning buoy and hazard marker, Serial: ' + serial;
                if (obj.broadcast) {
                    infoHtml += '<br><b>Broadcast:</b> ' + obj.broadcast;
                }
                if (obj.ping !== undefined) {
                    infoHtml += '<br><b>Ping:</b> ' + obj.ping;
                }
                if (obj.range !== undefined) {
                    infoHtml += '<br><b>Range:</b> ' + obj.range;
                }
            } else {
                infoHtml += 'Standard sensor and info relay buoy, Serial: ' + serial;
            }
        }
        else if (obj.type === 'jumpnode' || obj.type === 'jumppoint') {
            // Generate a random 5-character alphanumeric serial
            const serial = Math.random().toString(36).substring(2, 7).toUpperCase();
            infoHtml += 'Oliver Class jump stabilisation node. Serial: ' + serial;
        }
        else if (obj.type === 'planet') {
            if (obj['class']) {
                infoHtml += '<b>Class:</b> ' + obj['class'] + '<br>';
            }
        }
        else if (obj.zoneLabel) {
            infoHtml += '<b>Type:</b> ' + obj.zoneLabel + '<br>';
            if (obj.radius !== undefined) {
                infoHtml += '<b>Radius:</b> ' + obj.radius + '<br>';
            }
        }
        else {
            infoHtml += '<b>Type:</b> ' + obj.type;
        }

            // ——— append a description paragraph if one exists ———
            if (obj.description) {
                infoHtml += '<p class="desc-text">'
                          + obj.description
                          + '</p>';
            }
            document.getElementById('info').innerHTML = getInfoHeader() + infoHtml;
            bindGalacticButton();
            attachAuthorHover();
            openInfoPanel();

    setDefaultInfo();
    Plotly.newPlot('plot', fig.data, fig.layout, {responsive: true, scrollZoom: false});
        console.log("[DEBUG JS] Plotted traces count:", fig.data.length);
        console.log("[DEBUG JS] fig.data sample:", fig.data.slice(0,3));

    var plotDiv = document.getElementById('plot');

    // ——— Below-data grid: 20,000-unit gray, then 100,000-unit blue ———
    (function() {
        var minorGridSpacing = 20000;
        var majorGridSpacing = 100000;
        var minorGridMaxSpan = 500000;
        var minorGridColor = 'gray';
        var majorGridColor = '#1f4f8a';
        var baseShapes = (fig.layout.shapes || []).slice();
        var updateTimer = null;
        var refreshGridOnRelayout = true;

        function gridShapes(xRange, yRange) {
            var shapes = baseShapes.slice();
            var xSpan = Math.abs(xRange[1] - xRange[0]);
            var ySpan = Math.abs(yRange[1] - yRange[0]);
            var showMinorGrid = Math.max(xSpan, ySpan) <= minorGridMaxSpan;
            var lastX = Math.max(xRange[0], xRange[1]);
            var lastY = Math.max(yRange[0], yRange[1]);

            if (showMinorGrid) {
                var firstMinorX = Math.ceil(
                    Math.min(xRange[0], xRange[1]) / minorGridSpacing
                ) * minorGridSpacing;
                var firstMinorY = Math.ceil(
                    Math.min(yRange[0], yRange[1]) / minorGridSpacing
                ) * minorGridSpacing;
                for (var minorX = firstMinorX; minorX <= lastX; minorX += minorGridSpacing) {
                    shapes.push({
                        type: 'line',
                        xref: 'x',
                        yref: 'paper',
                        x0: minorX,
                        x1: minorX,
                        y0: 0,
                        y1: 1,
                        layer: 'below',
                        line: {color: minorGridColor, width: 1.5}
                    });
                }
                for (var minorY = firstMinorY; minorY <= lastY; minorY += minorGridSpacing) {
                    shapes.push({
                        type: 'line',
                        xref: 'paper',
                        yref: 'y',
                        x0: 0,
                        x1: 1,
                        y0: minorY,
                        y1: minorY,
                        layer: 'below',
                        line: {color: minorGridColor, width: 1.5}
                    });
                }
            }

            var firstX = Math.ceil(Math.min(xRange[0], xRange[1]) / majorGridSpacing) * majorGridSpacing;
            var firstY = Math.ceil(Math.min(yRange[0], yRange[1]) / majorGridSpacing) * majorGridSpacing;

            for (var x = firstX; x <= lastX; x += majorGridSpacing) {
                shapes.push({
                    type: 'line',
                    xref: 'x',
                    yref: 'paper',
                    x0: x,
                    x1: x,
                    y0: 0,
                    y1: 1,
                    layer: 'below',
                    line: {color: majorGridColor, width: 1.5}
                });
            }
            for (var y = firstY; y <= lastY; y += majorGridSpacing) {
                shapes.push({
                    type: 'line',
                    xref: 'paper',
                    yref: 'y',
                    x0: 0,
                    x1: 1,
                    y0: y,
                    y1: y,
                    layer: 'below',
                    line: {color: majorGridColor, width: 1.5}
                });
            }
            return shapes;
        }

        function applyGridLayers() {
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var update = {
                'shapes': gridShapes(xaxis.range, yaxis.range)
            };
            Plotly.relayout(plotDiv, update);
        }

        function scheduleGridUpdate(eventData) {
            var changedKeys = eventData ? Object.keys(eventData) : [];
            if (changedKeys.length && changedKeys.every(function(key) {
                return key === 'shapes';
            })) return;
            if (updateTimer !== null) clearTimeout(updateTimer);
            updateTimer = setTimeout(function() {
                updateTimer = null;
                applyGridLayers();
            }, 140);
        }

        setTimeout(applyGridLayers, 250);
        if (refreshGridOnRelayout) {
            plotDiv.on('plotly_relayout', scheduleGridUpdate);
        }
    })();

    // Use Plotly's built-in nearest-point selection for accurate clicks
    plotDiv.on('plotly_click', function(ev) {
        if (!ev || !ev.points || !ev.points.length) return;
        var p = ev.points[0];
        var picked = null;
        // Prefer original name from hovertext: "Name [Grid]"
        if (p.hovertext && typeof p.hovertext === 'string') {
            picked = p.hovertext.split(' [')[0];
        } else if (p.text && typeof p.text === 'string') {
            // Fallback to text label (strip any ** used for GM marking)
            picked = p.text.replace(/\*/g, '');
        }
        if (picked && objData[picked]) {
            highlight(picked);
            lastPlotlyClickTs = Date.now();
        }
    });

    plotDiv.on('plotly_clickmiss', function() {
        clearAnnotations();
    });

    function isPlotPointTarget(target) {
        if (!target || !target.closest) return false;
        return !!target.closest('.point, .textpoint, .text, .hovertext, .hoverlayer');
    }

    var clickStart = null;
    var dragged = false;
    var lastPlotlyClickTs = 0;
    plotDiv.addEventListener('mousedown', function(ev) {
        clickStart = {x: ev.clientX, y: ev.clientY};
        dragged = false;
    });
    plotDiv.addEventListener('mousemove', function(ev) {
        if (!clickStart) return;
        var dx = ev.clientX - clickStart.x;
        var dy = ev.clientY - clickStart.y;
        if ((dx * dx + dy * dy) > 25) dragged = true;
    });
    plotDiv.addEventListener('click', function(ev) {
        if (Date.now() - lastPlotlyClickTs < 250) return;
        if (dragged) return;
        if (isPlotPointTarget(ev.target)) return;
        closePanels();
        clearAnnotations();
    }, true);

    function gridRefFromXY(x, y) {
        var gridSize = 20000;
        var originX = -240000;
        var originZ = 280000;
        var dx = Math.floor((x - originX) / gridSize);
        var dz = Math.floor((y - originZ) / gridSize);
        function posMod(n, mod) {
            return ((n % mod) + mod) % mod;
        }
        var col = posMod(dx, 100);
        var row = posMod(dz, 26);
        var letter = String.fromCharCode(65 + row);
        var number = String(col).padStart(2, '0');
        return letter + number;
    }

    function axisPixelToData(axis, px) {
        if (axis && typeof axis.p2d === 'function') return axis.p2d(px);
        if (axis && typeof axis.p2c === 'function') return axis.p2c(px);
        if (axis && typeof axis.p2l === 'function') return axis.p2l(px);
        return null;
    }

    // ——— Cursor-centred wheel zoom with a single equal-scale range update ———
    (function() {
        var pendingWheelDelta = 0;
        var lastWheelClientX = 0;
        var lastWheelClientY = 0;
        var wheelFrame = null;

        function normalizedWheelDelta(evt) {
            if (evt.deltaMode === 1) return evt.deltaY * 16;
            if (evt.deltaMode === 2) return evt.deltaY * window.innerHeight;
            return evt.deltaY;
        }

        function applyWheelZoom() {
            wheelFrame = null;
            var full = plotDiv._fullLayout || {};
            var size = full._size;
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!size || !xaxis || !yaxis || !xaxis.range || !yaxis.range) {
                pendingWheelDelta = 0;
                return;
            }

            var rect = plotDiv.getBoundingClientRect();
            var xpx = lastWheelClientX - rect.left - size.l;
            var ypx = lastWheelClientY - rect.top - size.t;
            if (xpx < 0 || ypx < 0 || xpx > size.w || ypx > size.h) {
                pendingWheelDelta = 0;
                return;
            }

            var cursorX = axisPixelToData(xaxis, xpx);
            var cursorY = axisPixelToData(yaxis, ypx);
            if (!isFinite(cursorX) || !isFinite(cursorY)) {
                pendingWheelDelta = 0;
                return;
            }

            var delta = Math.max(-600, Math.min(600, pendingWheelDelta));
            pendingWheelDelta = 0;
            var zoomFactor = Math.exp(delta * 0.0015);
            var xRange = xaxis.range.slice();
            var yRange = yaxis.range.slice();

            Plotly.relayout(plotDiv, {
                'xaxis.range': [
                    cursorX + (xRange[0] - cursorX) * zoomFactor,
                    cursorX + (xRange[1] - cursorX) * zoomFactor
                ],
                'yaxis.range': [
                    cursorY + (yRange[0] - cursorY) * zoomFactor,
                    cursorY + (yRange[1] - cursorY) * zoomFactor
                ],
                'xaxis.autorange': false,
                'yaxis.autorange': false
            });
        }

        plotDiv.addEventListener('wheel', function(evt) {
            var full = plotDiv._fullLayout || {};
            var size = full._size;
            if (!size) return;
            var rect = plotDiv.getBoundingClientRect();
            var xpx = evt.clientX - rect.left - size.l;
            var ypx = evt.clientY - rect.top - size.t;
            if (xpx < 0 || ypx < 0 || xpx > size.w || ypx > size.h) return;

            evt.preventDefault();
            evt.stopPropagation();
            pendingWheelDelta += normalizedWheelDelta(evt);
            lastWheelClientX = evt.clientX;
            lastWheelClientY = evt.clientY;
            if (wheelFrame === null) {
                wheelFrame = requestAnimationFrame(applyWheelZoom);
            }
        }, {passive: false});
    })();

    var gridReadout = document.createElement('div');
    gridReadout.id = 'grid-readout';
    plotDiv.appendChild(gridReadout);
    var authorTooltip = document.createElement('div');
    authorTooltip.id = 'author-tooltip';
    document.body.appendChild(authorTooltip);

    function updateGridReadout(evt) {
        try {
            var full = plotDiv._fullLayout;
            if (!full || !full._size || !full.xaxis || !full.yaxis) return;
            var rect = plotDiv.getBoundingClientRect();
            var mouseX = evt.clientX - rect.left;
            var mouseY = evt.clientY - rect.top;
            var xpx = mouseX - full._size.l;
            var ypx = mouseY - full._size.t;
            if (xpx < 0 || ypx < 0 || xpx > full._size.w || ypx > full._size.h) {
                gridReadout.style.display = 'none';
                return;
            }
            var x = axisPixelToData(full.xaxis, xpx);
            var y = axisPixelToData(full.yaxis, ypx);
            if (!isFinite(x) || !isFinite(y)) {
                gridReadout.style.display = 'none';
                return;
            }
            gridReadout.textContent = gridRefFromXY(x, y);
            gridReadout.style.left = (mouseX + 12) + 'px';
            gridReadout.style.top = (mouseY + 12) + 'px';
            gridReadout.style.display = 'block';
        } catch (e) {
            gridReadout.style.display = 'none';
        }
    }

    plotDiv.addEventListener('mousemove', updateGridReadout);
    plotDiv.addEventListener('mouseleave', function() {
        gridReadout.style.display = 'none';
    });

    function attachAuthorHover() {
        var info = document.getElementById('info');
        if (!info) return;
        var target = info.querySelector('.author-hover');
        if (!target) return;
        target.addEventListener('mousemove', function(ev) {
            var authors = target.getAttribute('data-authors') || '';
            if (!authors) {
                authorTooltip.style.display = 'none';
                return;
            }
            authorTooltip.textContent = authors;
            authorTooltip.style.left = (ev.clientX + 12) + 'px';
            authorTooltip.style.top = (ev.clientY + 12) + 'px';
            authorTooltip.style.display = 'block';
        });
        target.addEventListener('mouseleave', function() {
            authorTooltip.style.display = 'none';
        });
    }

    // ——— Show warning-buoy labels only at close zoom ———
    (function() {
        var warningLabelMaxSpan = 250000;
        var warningLabelHysteresis = 5000;
        var warningLabelTimer = null;
        var labelsVisible = null;
        var warningBuoyIdx = fig.data
            .map(function(t, i) { return t && t.meta && t.meta.warning_buoy ? i : null; })
            .filter(function(i) { return i !== null; });

        function updateWarningLabels() {
            if (!warningBuoyIdx.length) return;
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var xSpan = Math.abs(xaxis.range[1] - xaxis.range[0]);
            var ySpan = Math.abs(yaxis.range[1] - yaxis.range[0]);
            var viewSpan = Math.max(xSpan, ySpan);
            var shouldShow;
            if (labelsVisible === null) {
                shouldShow = viewSpan <= warningLabelMaxSpan;
            } else if (labelsVisible) {
                shouldShow = viewSpan < warningLabelMaxSpan + warningLabelHysteresis;
            } else {
                shouldShow = viewSpan <= warningLabelMaxSpan - warningLabelHysteresis;
            }
            if (shouldShow === labelsVisible) return;
            labelsVisible = shouldShow;
            Plotly.update(
                plotDiv,
                {mode: shouldShow ? 'markers+text' : 'markers'},
                {
                    'xaxis.range': xaxis.range.slice(),
                    'yaxis.range': yaxis.range.slice(),
                    'xaxis.autorange': false,
                    'yaxis.autorange': false
                },
                warningBuoyIdx
            );
        }

        function scheduleWarningLabelUpdate() {
            if (warningLabelTimer !== null) clearTimeout(warningLabelTimer);
            warningLabelTimer = setTimeout(function() {
                warningLabelTimer = null;
                updateWarningLabels();
            }, 120);
        }

        setTimeout(updateWarningLabels, 250);
        plotDiv.on('plotly_relayout', scheduleWarningLabelUpdate);
    })();

    // ——— Reduce station-label density at wide zoom ———
    (function() {
        var stationLabelMaxSpan = 250000;
        var stationLabelHysteresis = 5000;
        var stationLabelTimer = null;
        var showAllStationLabels = null;
        var stationLabelIdx = fig.data
            .map(function(t, i) { return t && t.meta && t.meta.station_label ? i : null; })
            .filter(function(i) { return i !== null; });

        function updateStationLabels() {
            if (!stationLabelIdx.length) return;
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var xSpan = Math.abs(xaxis.range[1] - xaxis.range[0]);
            var ySpan = Math.abs(yaxis.range[1] - yaxis.range[0]);
            var viewSpan = Math.max(xSpan, ySpan);
            var shouldShowAll;
            if (showAllStationLabels === null) {
                shouldShowAll = viewSpan <= stationLabelMaxSpan;
            } else if (showAllStationLabels) {
                shouldShowAll = viewSpan < stationLabelMaxSpan + stationLabelHysteresis;
            } else {
                shouldShowAll = viewSpan <= stationLabelMaxSpan - stationLabelHysteresis;
            }
            if (shouldShowAll === showAllStationLabels) return;
            showAllStationLabels = shouldShowAll;

            var modes = stationLabelIdx.map(function(index) {
                var trace = fig.data[index];
                return shouldShowAll || (trace.meta && trace.meta.station_wide_label)
                    ? 'text'
                    : 'markers';
            });
            Plotly.update(
                plotDiv,
                {mode: modes},
                {
                    'xaxis.range': xaxis.range.slice(),
                    'yaxis.range': yaxis.range.slice(),
                    'xaxis.autorange': false,
                    'yaxis.autorange': false
                },
                stationLabelIdx
            );
        }

        function scheduleStationLabelUpdate() {
            if (stationLabelTimer !== null) clearTimeout(stationLabelTimer);
            stationLabelTimer = setTimeout(function() {
                stationLabelTimer = null;
                updateStationLabels();
            }, 120);
        }

        setTimeout(updateStationLabels, 250);
        plotDiv.on('plotly_relayout', scheduleStationLabelUpdate);
    })();

  var ctrl = document.getElementById('object-buttons');
  var activeSection = null;

  // Helper: create and append a single button
function addButton(label, fn, header, color, isHidden) {
    if (isHidden && !isGM()) return;
    var btn = document.createElement('button');
    btn.textContent = label;
    if (header) {
      btn.className = 'header';     // section header style
      btn.dataset.section = label;
      btn.onclick = null;           // no click action
    } else {
      btn.onclick = fn;             // bind the handler
      if (color) btn.style.backgroundColor = color;
      if (activeSection) btn.dataset.section = activeSection;
    }
    ctrl.appendChild(btn);
  }

  function addSection(label, populate) {
    var before = ctrl.children.length;
    addButton(label, null, true, null);
    var header = ctrl.children[ctrl.children.length - 1];
    var previousSection = activeSection;
    activeSection = label;
    if (typeof populate === 'function') {
      populate();
    }
    activeSection = previousSection;
    var added = ctrl.children.length - before - 1;
    if (added <= 0 && header && header.parentNode === ctrl) {
      ctrl.removeChild(header);
    }
  }
  
  function enterGMMode() {
    const pw = prompt("Enter ONI Auth Code: --We will store a cookie for the purpose of tracking if you have authenticated or not--");
    if (pw === "oni1") {
      document.cookie = "gmMode=1; path=/; max-age=31536000";
      location.reload();
    } else {
      alert("Incorrect password.");
    }
  }

  function isGM() {
    return document.cookie.split(';').some(c => c.trim() === 'gmMode=1');
  }

  function exitGMMode() {
    document.cookie = "gmMode=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    location.reload();
  }

  function renderGMControls() {
    const div = document.getElementById('gm-controls');
    div.innerHTML = '';
    const btn = document.createElement('button');
    btn.style.width = '100%';
    if (isGM()) {
      btn.textContent = 'ONI Logout';
      btn.onclick = exitGMMode;
    } else {
      btn.textContent = 'ONI Login';
      btn.onclick = enterGMMode;
    }
    div.appendChild(btn);
  }

  // Search filter
  document.getElementById('search-box').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    const buttons = Array.from(document.querySelectorAll('#object-buttons button'));
    buttons.forEach(btn => {
      const label = btn.textContent.toLowerCase();
      const isHeader = btn.classList.contains('header');
      if (isHeader) {
        btn.style.display = 'none';
      } else {
        btn.style.display = label.includes(query) ? '' : 'none';
      }
    });
    buttons
      .filter(btn => btn.classList.contains('header'))
      .forEach(header => {
        const section = header.dataset.section;
        const hasVisibleEntry = buttons.some(btn =>
          !btn.classList.contains('header') &&
          btn.dataset.section === section &&
          btn.style.display !== 'none'
        );
        header.style.display = hasVisibleEntry ? '' : 'none';
      });
  });

  // Briefing controls: URL state for initial load, postMessage for live changes.
  function setBriefingPanels(left, right) {
    if (typeof left === 'boolean') pageBody.classList.toggle('briefing-hide-left', !left);
    if (typeof right === 'boolean') pageBody.classList.toggle('briefing-hide-right', !right);
    closePanels();
    requestAnimationFrame(function() { Plotly.Plots.resize(plotDiv); });
  }

  function showBriefingObject(name) {
    if (typeof name !== 'string' || !Object.prototype.hasOwnProperty.call(objData, name)) return false;
    if (objData[name].hidden && !isGM()) return false;
    setBriefingPanels(undefined, true);
    return highlight(name);
  }

  var briefingParams = new URLSearchParams(window.location.search);
  var briefingPanels = briefingParams.get('panels');
  if (briefingPanels === 'none') setBriefingPanels(false, false);
  else if (briefingPanels === 'left') setBriefingPanels(true, false);
  else if (briefingPanels === 'right') setBriefingPanels(false, true);
  else if (briefingPanels === 'both') setBriefingPanels(true, true);
  if (briefingParams.has('object')) showBriefingObject(briefingParams.get('object'));

  window.addEventListener('message', function(event) {
    if (event.source !== window.parent) return;
    if (event.origin !== 'https://tsn-mission-briefing.fishevans.chatgpt.site' &&
        event.origin !== window.location.origin) return;
    var command = event.data;
    if (!command || command.source !== 'tsn-briefing' || typeof command.type !== 'string') return;
    if (command.type === 'setPanels') setBriefingPanels(command.left, command.right);
    else if (command.type === 'showObject') showBriefingObject(command.name);
    else if (command.type === 'clearSelection') clearAnnotations();
  });

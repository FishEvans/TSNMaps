    <style>
        html, body { margin: 0; height: 100%; background: black; color: white; }
        /* === Description typography controls ===
           Tweak these two variables to change description sizes globally */
        :root {
            --desc-font-size: 130%;
            --hull-desc-font-size: 130%;
            --panel-bg: #24272d;
            --panel-border: rgba(255, 255, 255, 0.08);
            --toolbar-bg: rgba(12, 14, 18, 0.92);
            --toolbar-border: rgba(255, 255, 255, 0.12);
            --mobile-toolbar-height: 58px;
        }
        body { display: flex; height: 100vh; overflow: hidden; position: relative; }
        .desc-text { font-size: var(--desc-font-size); margin-top: 8px; }
        .hull-desc { font-size: var(--hull-desc-font-size); margin-top: 5px; color: #ccc; }
        .info-title { font-size: 26px; font-weight: bold; text-align: center; margin: 2px 0 6px; }
        .info-desc { font-size: 16px; color: #fff; }
        .info-meta { font-size: 12px; color: #ccc; }
        .info-meta-block { margin-bottom: 6px; }
        .info-section { margin-top: 6px; }
        #controls, #info {
            background: linear-gradient(180deg, rgba(43, 47, 56, 0.98), rgba(28, 31, 38, 0.98));
            border-right: 1px solid var(--panel-border);
            overflow-y: auto;
            padding: 10px 12px;
            box-sizing: border-box;
            scrollbar-gutter: stable;
        }
        #controls { flex: 1; min-width: 220px; max-width: 350px; }
        #plot {
            flex: 3;
            min-width: 0;
            position: relative;
            touch-action: none;
            background:
                radial-gradient(circle at top, rgba(0, 188, 212, 0.12), transparent 38%),
                radial-gradient(circle at bottom, rgba(255, 196, 0, 0.08), transparent 34%),
                #050608;
        }
        #info {
            flex: 1;
            min-width: 240px;
            border-right: none;
            border-left: 1px solid var(--panel-border);
        }
        #mobile-toolbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            height: var(--mobile-toolbar-height);
            padding: env(safe-area-inset-top, 0) 12px 10px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--toolbar-border);
            box-sizing: border-box;
            align-items: center;
            gap: 10px;
        }
        #mobile-title {
            flex: 1;
            font-size: 15px;
            font-weight: 700;

            text-transform: uppercase;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mobile-toggle {
            width: auto;
            min-width: 86px;
            margin: 0;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: center;
        }
        #panel-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 25;
            background: rgba(3, 5, 9, 0.58);
            backdrop-filter: blur(3px);
        }
        #grid-readout {
            position: absolute;
            display: none;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #00bcd4;
            border-radius: 4px;
            color: #00e5ff;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        #author-tooltip {
            position: absolute;
            display: none;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #00bcd4;
            border-radius: 4px;
            color: #00e5ff;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            z-index: 11;
            white-space: nowrap;
        }
        h2.header { margin-top: 0; margin-bottom: 5px; text-align: center; }
        h3.subheader { margin-top: 0; margin-bottom: 15px; text-align: center; color: #ccc; }
        .alignment-image { display: block; max-width: 100%; height: auto; margin: 10px auto; }
        button {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            background: rgba(54, 54, 54, 0.94);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 10px;
            text-align: left;
            cursor: pointer;
            font-size: 20px;
            border-radius: 999px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        button:hover,
        button:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.06);
            outline: none;
        }
        button.header {
            background: #444;
            cursor: default;
            font-size: 24px;
            border-radius: 10px;
            transform: none;
            filter: none;
        }
        #search-box {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        #search-box::placeholder { color: rgba(255, 255, 255, 0.6); }
        @media (max-width: 900px) {
            body { display: block; }
            #mobile-toolbar { display: flex; }
            #controls, #info {
                position: fixed;
                top: 0;
                bottom: 0;
                z-index: 40;
                width: min(86vw, 360px);
                max-width: none;
                min-width: 0;
                padding:
                    calc(var(--mobile-toolbar-height) + env(safe-area-inset-top, 0) + 12px)
                    14px
                    calc(18px + env(safe-area-inset-bottom, 0));
                box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
                transition: transform 0.24s ease;
            }
            #controls {
                left: 0;
                border-right: 1px solid var(--panel-border);
                transform: translateX(-104%);
            }
            #info {
                right: 0;
                border-left: 1px solid var(--panel-border);
                transform: translateX(104%);
            }
            body.drawer-left-open #controls { transform: translateX(0); }
            body.drawer-right-open #info { transform: translateX(0); }
            body.drawer-left-open #panel-overlay,
            body.drawer-right-open #panel-overlay { display: block; }
            #plot {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
            }
            .info-title { font-size: 22px; }
            .info-desc, .desc-text, .hull-desc { font-size: 15px; }
            button { font-size: 17px; }
            button.header { font-size: 20px; }
        }

    // ——— Below-data grid: 20,000-unit gray, then 100,000-unit blue ———
    (function() {
        var minorGridSpacing = 20000;
        var majorGridSpacing = 100000;
        var minorGridMaxSpan = 500000;
        var minorGridColor = 'gray';
        var majorGridColor = '#1f4f8a';
        var baseShapes = (fig.layout.shapes || []).slice();
        var updateTimer = null;
        var refreshGridOnRelayout = true;

        function gridShapes(xRange, yRange) {
            var shapes = baseShapes.slice();
            var xSpan = Math.abs(xRange[1] - xRange[0]);
            var ySpan = Math.abs(yRange[1] - yRange[0]);
            var showMinorGrid = Math.max(xSpan, ySpan) <= minorGridMaxSpan;
            var lastX = Math.max(xRange[0], xRange[1]);
            var lastY = Math.max(yRange[0], yRange[1]);

            if (showMinorGrid) {
                var firstMinorX = Math.ceil(
                    Math.min(xRange[0], xRange[1]) / minorGridSpacing
                ) * minorGridSpacing;
                var firstMinorY = Math.ceil(
                    Math.min(yRange[0], yRange[1]) / minorGridSpacing
                ) * minorGridSpacing;
                for (var minorX = firstMinorX; minorX <= lastX; minorX += minorGridSpacing) {
                    shapes.push({
                        type: 'line',
                        xref: 'x',
                        yref: 'paper',
                        x0: minorX,
                        x1: minorX,
                        y0: 0,
                        y1: 1,
                        layer: 'below',
                        line: {color: minorGridColor, width: 1.5}
                    });
                }
                for (var minorY = firstMinorY; minorY <= lastY; minorY += minorGridSpacing) {
                    shapes.push({
                        type: 'line',
                        xref: 'paper',
                        yref: 'y',
                        x0: 0,
                        x1: 1,
                        y0: minorY,
                        y1: minorY,
                        layer: 'below',
                        line: {color: minorGridColor, width: 1.5}
                    });
                }
            }

            var firstX = Math.ceil(Math.min(xRange[0], xRange[1]) / majorGridSpacing) * majorGridSpacing;
            var firstY = Math.ceil(Math.min(yRange[0], yRange[1]) / majorGridSpacing) * majorGridSpacing;

            for (var x = firstX; x <= lastX; x += majorGridSpacing) {
                shapes.push({
                    type: 'line',
                    xref: 'x',
                    yref: 'paper',
                    x0: x,
                    x1: x,
                    y0: 0,
                    y1: 1,
                    layer: 'below',
                    line: {color: majorGridColor, width: 1.5}
                });
            }
            for (var y = firstY; y <= lastY; y += majorGridSpacing) {
                shapes.push({
                    type: 'line',
                    xref: 'paper',
                    yref: 'y',
                    x0: 0,
                    x1: 1,
                    y0: y,
                    y1: y,
                    layer: 'below',
                    line: {color: majorGridColor, width: 1.5}
                });
            }
            return shapes;
        }

        function applyGridLayers() {
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var update = {
                'shapes': gridShapes(xaxis.range, yaxis.range)
            };
            Plotly.relayout(plotDiv, update);
        }

        function scheduleGridUpdate(eventData) {
            var changedKeys = eventData ? Object.keys(eventData) : [];
            if (changedKeys.length && changedKeys.every(function(key) {
                return key === 'shapes';
            })) return;
            if (updateTimer !== null) clearTimeout(updateTimer);
            updateTimer = setTimeout(function() {
                updateTimer = null;
                applyGridLayers();
            }, 140);
        }

        setTimeout(applyGridLayers, 250);
        if (refreshGridOnRelayout) {
            plotDiv.on('plotly_relayout', scheduleGridUpdate);
        }
    })();

    function gridRefFromXY(x, y) {
        var gridSize = 20000;
        var originX = -240000;
        var originZ = 280000;
        var dx = Math.floor((x - originX) / gridSize);
        var dz = Math.floor((y - originZ) / gridSize);
        function posMod(n, mod) {
            return ((n % mod) + mod) % mod;
        }
        var col = posMod(dx, 100);
        var row = posMod(dz, 26);
        var letter = String.fromCharCode(65 + row);
        var number = String(col).padStart(2, '0');
        return letter + number;
    }

    function axisPixelToData(axis, px) {
        if (axis && typeof axis.p2d === 'function') return axis.p2d(px);
        if (axis && typeof axis.p2c === 'function') return axis.p2c(px);
        if (axis && typeof axis.p2l === 'function') return axis.p2l(px);
        return null;
    }

    // ——— Cursor-centred wheel zoom with a single equal-scale range update ———
    (function() {
        var pendingWheelDelta = 0;
        var lastWheelClientX = 0;
        var lastWheelClientY = 0;
        var wheelFrame = null;

        function normalizedWheelDelta(evt) {
            if (evt.deltaMode === 1) return evt.deltaY * 16;
            if (evt.deltaMode === 2) return evt.deltaY * window.innerHeight;
            return evt.deltaY;
        }

        function applyWheelZoom() {
            wheelFrame = null;
            var full = plotDiv._fullLayout || {};
            var size = full._size;
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!size || !xaxis || !yaxis || !xaxis.range || !yaxis.range) {
                pendingWheelDelta = 0;
                return;
            }

            var rect = plotDiv.getBoundingClientRect();
            var xpx = lastWheelClientX - rect.left - size.l;
            var ypx = lastWheelClientY - rect.top - size.t;
            if (xpx < 0 || ypx < 0 || xpx > size.w || ypx > size.h) {
                pendingWheelDelta = 0;
                return;
            }

            var cursorX = axisPixelToData(xaxis, xpx);
            var cursorY = axisPixelToData(yaxis, ypx);
            if (!isFinite(cursorX) || !isFinite(cursorY)) {
                pendingWheelDelta = 0;
                return;
            }

            var delta = Math.max(-600, Math.min(600, pendingWheelDelta));
            pendingWheelDelta = 0;
            var zoomFactor = Math.exp(delta * 0.0015);
            var xRange = xaxis.range.slice();
            var yRange = yaxis.range.slice();

            Plotly.relayout(plotDiv, {
                'xaxis.range': [
                    cursorX + (xRange[0] - cursorX) * zoomFactor,
                    cursorX + (xRange[1] - cursorX) * zoomFactor
                ],
                'yaxis.range': [
                    cursorY + (yRange[0] - cursorY) * zoomFactor,
                    cursorY + (yRange[1] - cursorY) * zoomFactor
                ],
                'xaxis.autorange': false,
                'yaxis.autorange': false
            });
        }

        plotDiv.addEventListener('wheel', function(evt) {
            var full = plotDiv._fullLayout || {};
            var size = full._size;
            if (!size) return;
            var rect = plotDiv.getBoundingClientRect();
            var xpx = evt.clientX - rect.left - size.l;
            var ypx = evt.clientY - rect.top - size.t;
            if (xpx < 0 || ypx < 0 || xpx > size.w || ypx > size.h) return;

            evt.preventDefault();
            evt.stopPropagation();
            pendingWheelDelta += normalizedWheelDelta(evt);
            lastWheelClientX = evt.clientX;
            lastWheelClientY = evt.clientY;
            if (wheelFrame === null) {
                wheelFrame = requestAnimationFrame(applyWheelZoom);
            }
        }, {passive: false});
    })();

    function updateGridReadout(evt) {

            var rect = plotDiv.getBoundingClientRect();
            var mouseX = evt.clientX - rect.left;
            var mouseY = evt.clientY - rect.top;
            var xpx = mouseX - full._size.l;
            var ypx = mouseY - full._size.t;
            if (xpx < 0 || ypx < 0 || xpx > full._size.w || ypx > full._size.h) {
                gridReadout.style.display = 'none';
                return;
            }
            var x = axisPixelToData(full.xaxis, xpx);
            var y = axisPixelToData(full.yaxis, ypx);

        var labelsVisible = null;
        var warningBuoyIdx = fig.data
            .map(function(t, i) { return t && t.meta && t.meta.warning_buoy ? i : null; })
            .filter(function(i) { return i !== null; });

        function updateWarningLabels() {
            if (!warningBuoyIdx.length) return;
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var xSpan = Math.abs(xaxis.range[1] - xaxis.range[0]);
            var ySpan = Math.abs(yaxis.range[1] - yaxis.range[0]);
            var viewSpan = Math.max(xSpan, ySpan);
            var shouldShow;
            if (labelsVisible === null) {
                shouldShow = viewSpan <= warningLabelMaxSpan;
            } else if (labelsVisible) {
                shouldShow = viewSpan < warningLabelMaxSpan + warningLabelHysteresis;
            } else {
                shouldShow = viewSpan <= warningLabelMaxSpan - warningLabelHysteresis;
            }
            if (shouldShow === labelsVisible) return;
            labelsVisible = shouldShow;
            Plotly.update(
                plotDiv,
                {mode: shouldShow ? 'markers+text' : 'markers'},
                {
                    'xaxis.range': xaxis.range.slice(),
                    'yaxis.range': yaxis.range.slice(),
                    'xaxis.autorange': false,
                    'yaxis.autorange': false
                },
                warningBuoyIdx
            );
        }

        function scheduleWarningLabelUpdate() {
            if (warningLabelTimer !== null) clearTimeout(warningLabelTimer);
            warningLabelTimer = setTimeout(function() {
                warningLabelTimer = null;
                updateWarningLabels();
            }, 120);
        }

        setTimeout(updateWarningLabels, 250);
        plotDiv.on('plotly_relayout', scheduleWarningLabelUpdate);
    })();

    // ——— Reduce station-label density at wide zoom ———
    (function() {
        var stationLabelMaxSpan = 250000;
        var stationLabelHysteresis = 5000;
        var stationLabelTimer = null;
        var showAllStationLabels = null;
        var stationLabelIdx = fig.data
            .map(function(t, i) { return t && t.meta && t.meta.station_label ? i : null; })
            .filter(function(i) { return i !== null; });

        function updateStationLabels() {
            if (!stationLabelIdx.length) return;
            var full = plotDiv._fullLayout || {};
            var xaxis = full.xaxis;
            var yaxis = full.yaxis;
            if (!xaxis || !yaxis || !xaxis.range || !yaxis.range) return;
            var xSpan = Math.abs(xaxis.range[1] - xaxis.range[0]);
            var ySpan = Math.abs(yaxis.range[1] - yaxis.range[0]);
            var viewSpan = Math.max(xSpan, ySpan);
            var shouldShowAll;
            if (showAllStationLabels === null) {
                shouldShowAll = viewSpan <= stationLabelMaxSpan;
            } else if (showAllStationLabels) {
                shouldShowAll = viewSpan < stationLabelMaxSpan + stationLabelHysteresis;
            } else {
                shouldShowAll = viewSpan <= stationLabelMaxSpan - stationLabelHysteresis;
            }
            if (shouldShowAll === showAllStationLabels) return;
            showAllStationLabels = shouldShowAll;

            var modes = stationLabelIdx.map(function(index) {
                var trace = fig.data[index];
                return shouldShowAll || (trace.meta && trace.meta.station_wide_label)
                    ? 'text'
                    : 'markers';
            });
            Plotly.update(
                plotDiv,
                {mode: modes},
                {
                    'xaxis.range': xaxis.range.slice(),
                    'yaxis.range': yaxis.range.slice(),
                    'xaxis.autorange': false,
                    'yaxis.autorange': false
                },
                stationLabelIdx
            );
        }

        function scheduleStationLabelUpdate() {
            if (stationLabelTimer !== null) clearTimeout(stationLabelTimer);
            stationLabelTimer = setTimeout(function() {
                stationLabelTimer = null;
                updateStationLabels();
            }, 120);
        }

        setTimeout(updateStationLabels, 250);
        plotDiv.on('plotly_relayout', scheduleStationLabelUpdate);
    })();

  var ctrl = document.getElementById('object-buttons');
  var activeSection = null;

  // Helper: create and append a single button
function addButton(label, fn, header, color, isHidden) {
    if (isHidden && !isGM()) return;
    var btn = document.createElement('button');
    btn.textContent = label;
    if (header) {
      btn.className = 'header';     // section header style
      btn.dataset.section = label;
      btn.onclick = null;           // no click action
    } else {
      btn.onclick = fn;             // bind the handler
      if (color) btn.style.backgroundColor = color;
      if (activeSection) btn.dataset.section = activeSection;
    }
    ctrl.appendChild(btn);
  }

  function addSection(label, populate) {
    var before = ctrl.children.length;
    addButton(label, null, true, null);
    var header = ctrl.children[ctrl.children.length - 1];
    var previousSection = activeSection;
    activeSection = label;
    if (typeof populate === 'function') {
      populate();
    }
    activeSection = previousSection;
    var added = ctrl.children.length - before - 1;
    if (added <= 0 && header && header.parentNode === ctrl) {
      ctrl.removeChild(header);
    }
  }
  
  function enterGMMode() {
    const pw = prompt("Enter ONI Auth Code: --We will store a cookie for the purpose of tracking if you have authenticated or not--");
    if (pw === "oni1") {
      document.cookie = "gmMode=1; path=/; max-age=31536000";
      location.reload();
    } else {
      alert("Incorrect password.");
    }
  }

  function isGM() {
    return document.cookie.split(';').some(c => c.trim() === 'gmMode=1');
  }

  function exitGMMode() {
    document.cookie = "gmMode=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    location.reload();
  }

  function renderGMControls() {
    const div = document.getElementById('gm-controls');
    div.innerHTML = '';
    const btn = document.createElement('button');
    btn.style.width = '100%';
    if (isGM()) {
      btn.textContent = 'ONI Logout';
      btn.onclick = exitGMMode;
    } else {
      btn.textContent = 'ONI Login';
      btn.onclick = enterGMMode;
    }
    div.appendChild(btn);
  }

  renderGMControls();

      closePanels();
    } else {

  // Search filter
  document.getElementById('search-box').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    const buttons = Array.from(document.querySelectorAll('#object-buttons button'));
    buttons.forEach(btn => {
      const label = btn.textContent.toLowerCase();
      const isHeader = btn.classList.contains('header');
      if (isHeader) {
        btn.style.display = 'none';
      } else {
        btn.style.display = label.includes(query) ? '' : 'none';
      }
    });
    buttons
      .filter(btn => btn.classList.contains('header'))
      .forEach(header => {
        const section = header.dataset.section;
        const hasVisibleEntry = buttons.some(btn =>
          !btn.classList.contains('header') &&
          btn.dataset.section === section &&
          btn.style.display !== 'none'
        );
        header.style.display = hasVisibleEntry ? '' : 'none';
      });
  });
